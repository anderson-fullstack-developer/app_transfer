name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Nao sao segredos reais -- so precisam de ter >=16 caracteres para o
      # parseApiEnv aceitar. Nunca usados fora deste job efemero.
      JWT_ACCESS_SECRET: ci-only-access-secret-nao-e-real
      JWT_REFRESH_SECRET: ci-only-refresh-secret-nao-e-real
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Aplicar migrations na BD de testes (branch Neon isolado)
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Testes de integracao/E2E
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  # Deploy é sempre manual/explícito — nunca automático (secção 33 da doc).

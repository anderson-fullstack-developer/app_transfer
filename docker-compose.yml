# Infraestrutura local de desenvolvimento.
# Uso:  docker compose up -d   (arranca em background)
#       docker compose down    (para; adiciona -v para apagar os dados)
#
# So Postgres e Redis. Nao adicionamos infra sem uso real (seccao 3 da doc).

services:
  postgres:
    image: postgres:16-alpine
    container_name: app_transfer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_transfer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_transfer']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: app_transfer_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
